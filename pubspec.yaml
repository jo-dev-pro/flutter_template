name: flutter_template
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
    
# 🌐 한글 현지화 패키지 (반드시 아래처럼 sdk: flutter를 명시해야 합니다)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 1. 상태 관리 & 라우팅 패키지
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.0

  # 2. 데이터 모델 및 유틸리티 패키지
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2          # 3자리 콤마 포맷용 필수 패키지
  image_picker: ^1.1.2    # 이미지 피커용 필수 패키지


dev_dependencies:
  flutter_test:
    sdk: flutter

  # 3. 코드 생성(Code Generation) 툴 (개발 단계에서만 사용)
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.4


  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

